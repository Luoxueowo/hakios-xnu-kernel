# The identity the loader publishes in the device tree: what Darwin user space -- MobileGestalt above
# all -- takes the phone for, and what it builds the UDID from. Compiled into the loader by
# xnuloader/build.sh (xnuloader/mkidentityconf.py), so changing a value here is a rebuild of the boot
# image and nothing else. The model itself (iPhone10,3, "iPhone X") is not here: that one comes from
# the device tree in the IPSW (xnuloader/mkidentity.sh, identity.h).
#
# These are the fields iBoot fills in on a real phone from its factory configuration. The values here
# are the identity this port presents -- written down for the model it is meant to pass for -- and are
# not read from any phone's factory data. Changing them changes the UDID MobileGestalt derives, and
# with it what activation and the App Store see as the device.
#
# serial-number, mlb-serial-number, model-number, region-info and regulatory-model-number are ASCII,
# at most 31 characters (the device tree pads the field to 32 bytes with zeros).
# unique-chip-id (ECID), chip-id and board-id are the numbers a D22AP reports; together with the
# serial number and the two MAC addresses they are what MobileGestalt builds the UDID from.

serial-number=C6KDPA7K0GR8
mlb-serial-number=C7H046300J7PV284C
model-number=MG8E3
region-info=CH/A
regulatory-model-number=A2400

unique-chip-id=0x000052445730001
chip-id=0x8015
board-id=0x06

wifi-mac=02:52:44:57:00:01
bluetooth-mac=02:52:44:57:00:02

# The model: what Darwin user space is to think it runs on. The port's files are the iPhone X's, so
# identity.h says iPhone10,3; the values here put an iPhone 12 mini in the device tree's place
# (model=iPhone13,1, board D52gAP, /product's product-name). The /product artwork properties --
# screen class, scale, idiom -- still come from the iPhone X's tree: only the name and the model
# change, so Darwin still draws for the screen the kernel actually has.
model=iPhone13,1
board=D52gAP
product-name=iPhone 12 mini
