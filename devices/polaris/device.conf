# devices/polaris/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device polaris
	title       Xiaomi MIX 2S
	vendor      Xiaomi
	soc         sdm845
	defconfig   polaris_defconfig
	maintainer  Luoxue
	status      display     works     the desktop comes up through the SDM845 DPU (`fb_flip=1 fb_native=2`) at 1080x2160, 360x720 points at 3x: the DPU reads each full-panel surface's pixels where they are, 0.8 ms of driver time a frame with nothing copied; the three surface slots are held until the panel has moved off them
	status      touch       works     Synaptics S3330 RMI4 touch input works on the MIX 2S (`touchscreen=1`)
	status      buttons     works     MIX 2S PM8998 power and volume keys work (`touchscreen=1`)
	status      cpu         works     the OSM's two domains (`cpufreq=1`): the big cores 300-2803 MHz, the little ones 300-1766, both asked for the top row at boot; a governor holds them to 85 C (the little ones to 93) from the cores' own sensors, a row at a time
	status      storage     partial   the `darwin` APFS containers and HFSX Data are installed; the latest boot mounted Data at `/private/var`; `userdata` remains unformatted for Android
	status      battery     works     battery level and charging status are reported through HakiosBattery (`battery=1`)
	status      gpu         partial   Mesa Freedreno reports FD630 and CoreAnimation selects its accelerated renderer, which needs 17-22 ms a frame for the full 1080x2160 screen: 40-55 frames a second, the display path no longer the limit
