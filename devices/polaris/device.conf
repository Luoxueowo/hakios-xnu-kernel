# devices/polaris/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device polaris
	title       Xiaomi MIX 2S
	vendor      Xiaomi
	soc         sdm845
	defconfig   polaris_defconfig
	firmware    pull-firmware.sh
	maintainer  Luoxue
	status      display     partial   UEFI boots successfully; display through the UEFI framebuffer is partially working
	status      touch       works     Synaptics S3330 RMI4 touch input works on the MIX 2S (`touchscreen=1`)
	status      buttons     works     MIX 2S PM8998 power and volume keys work (`touchscreen=1`)
	status      cpu         works     all eight cores (`bootcpu=7 cpus=8 cpufreq=1`); the clock is the boot loader's, SDM845's OSM is not driven
	status      storage     works     persistent HFSX Data volume; Settings reports about 120–121 GB available
	status      battery     works     battery level and charging status are reported through HakiosBattery (`battery=1`)
	status      gpu         partial   A630 backend is built and seven firmware files match the phone's read-only `/vendor/firmware`; startup and rendering have not been validated on-device (`gpu=1` is opt-in)
