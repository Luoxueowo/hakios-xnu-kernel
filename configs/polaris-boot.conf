# Polaris direct-boot image configuration, read by tools/build-boot.sh.
# Edit BOOT_ARGS, image paths, or build switches here; do not edit the script.

DEVICE=polaris
KERNEL_DEFCONFIG=polaris_defconfig
BUILD_JOBS=8

# Rebuild each component before packaging. Set a switch to 0 to reuse its existing output.
BUILD_KERNEL=1
BUILD_LOADER=1
BUILD_USERLAND=1
USERLAND_REST=0
USERLAND_CRYPTEXES=flash

KERNEL_IMAGE=hakios-kernel
LOADER_IMAGE=xnuloader/loader.efi
RESIDENT_IMAGE=userland/flashboot.apfs
RESIDENT_VOLUME=Boot
RAMDISK_IMAGE=userland/root.apfs
RAMDISK_VOLUME=polaris

# The resident flashboot image is md0 and carries /sbin/launchd.
# The payload ramdisk is md1 and carries /sbin/init, mounted on /polaris.
# Cryptexes stay on the installed darwin partition instead of bloating flashboot.
# No loader_return_after is set for a normal direct boot.
# Hide screen logs while continuing to capture logs and write logdump.
BOOT_ARGS="debug=0x8 rd=md0 root_apfs=ufs_darwin ufs=2 ufs_native=1 ufs_write=0 battery=1 touchscreen=1 bootcpu=7 cpus=4 screen_log=0"

OUTPUT_IMAGE=out/boot/polaris.img
MAX_IMAGE_BYTES=67108864
