# Polaris direct-boot image configuration, read by tools/build-boot.sh.
# Edit BOOT_ARGS, image paths, or build switches here; do not edit the script.

DEVICE=polaris
KERNEL_DEFCONFIG=polaris_defconfig
BUILD_JOBS=8

# Rebuild each component before packaging. Set a switch to 0 to reuse its existing output.
BUILD_KERNEL=1
BUILD_LOADER=1
BUILD_USERLAND=1
USERLAND_REST=0
USERLAND_CRYPTEXES=flash
USERLAND_GL=1

# Fixed System/OS/App slots; boot only after installing the matching Data volume.
STORAGE_LAYOUT=configs/polaris-storage.json

KERNEL_IMAGE=hakios-kernel
LOADER_IMAGE=xnuloader/loader.efi
RESIDENT_IMAGE=userland/flashboot.apfs
RESIDENT_VOLUME=Boot
RAMDISK_IMAGE=userland/root.apfs
RAMDISK_VOLUME=polaris

# The resident flashboot image is md0 and carries /sbin/launchd.
# The payload ramdisk is md1 and carries /sbin/init, mounted on /polaris.
# Cryptexes stay on the installed darwin partition instead of bloating flashboot.
# Hide screen logs while continuing to capture logs and write logdump.
# 1080x2160 at 3x (360x720 points): the panel's own pixels, so frames are copied 1:1, not scaled.
# fb_native=2: the DPU reads a full-panel surface's pixels where they are, no copy at all (0.8 ms a frame
# of driver time against 3.8-7.6 copying). Three slots of the reserved region hold those surfaces, and each
# is held until the panel has moved off it -- two latches, and two frames of the interface's own counter
# when it can be read. Handed on sooner, the window server's next surface got the memory the panel was
# still reading, and half of that frame went on the screen (24 November, fixed).
# fb_beat=0: no display interface is known to fb_beam on SDM845, so the beat is the driver's own and waits
# 6.7 ms a frame for nothing; flips already take effect at the panel's frame boundary.
# The clocks: cpufreq=1 drives the OSM's two domains (drivers/power/hakios.cpufreq.c) and asks the top row of
# each at boot -- the boot loader leaves a modest one and nothing else raises it. cpufreq_gov=85 then holds the
# big cores near 60 degrees from the SoC's own sensors (hakios.thermal.c, thermal=1), two degrees of headroom
# before it comes back up; thermal_stop=0 keeps the readings only, without handing the phone back to the loader
# when it gets hot (the governor brings the clocks down instead).
# battery_stop=2: a run left alone goes back to the loader at 2% or less (only with a battery, a known charge,
# and no charger attached) -- the last the gauge can be trusted at, and the least protection that still keeps the
# phone from being left flat on USB; battery_stop_poll=20 is how often it looks.
BOOT_ARGS="debug=0x8 rd=md0 root_apfs=ufs_darwin ufs=2 ufs_native=1 ufs_write=1 battery=1 touchscreen=1 bootcpu=7 cpus=8 cpufreq=1 cpufreq_gov=85 thermal=1 thermal_stop=0 battery_stop=2 battery_stop_poll=20 screen_log=0 gpu=1 adreno_keep=1 fb_flip=1 fbwidth=1080 fbheight=2160 fb_native=2 fb_beat=0 fb_ca_hz=60 autounlock=0"

OUTPUT_IMAGE=out/boot/polaris.img
MAX_IMAGE_BYTES=67108864
