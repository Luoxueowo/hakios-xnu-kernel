# Polaris direct-boot image configuration, read by tools/build-boot.sh.
# Edit BOOT_ARGS, image paths, or build switches here; do not edit the script.

DEVICE=polaris
KERNEL_DEFCONFIG=polaris_defconfig
BUILD_JOBS=8

# Rebuild each component before packaging. Set a switch to 0 to reuse its existing output.
BUILD_KERNEL=1
BUILD_LOADER=1
BUILD_USERLAND=1
USERLAND_REST=0
USERLAND_CRYPTEXES=flash

# Fixed System/OS/App slots; boot only after installing the matching Data volume.
STORAGE_LAYOUT=configs/polaris-storage.json

KERNEL_IMAGE=hakios-kernel
LOADER_IMAGE=xnuloader/loader.efi
RESIDENT_IMAGE=userland/flashboot.apfs
RESIDENT_VOLUME=Boot
RAMDISK_IMAGE=userland/root.apfs
RAMDISK_VOLUME=polaris

# The resident flashboot image is md0 and carries /sbin/launchd.
# The payload ramdisk is md1 and carries /sbin/init, mounted on /polaris.
# Cryptexes stay on the installed darwin partition instead of bloating flashboot.
# Hide screen logs while continuing to capture logs and write logdump.
#
# The four storage arguments name the fixed slots of configs/polaris-storage.json: the OS and App
# cryptex containers at 10 GiB and 14 GiB, the persistent HFSX volume after them at 15 GiB.
#
# gpu=1 starts the A630 while the system starts and keeps it for the window server (the service
# HakiosGPU, see docs/porting/polaris-adreno-630.md). A bring-up that fails leaves one line in the
# log and the system draws in software, so it is safe to leave on. It is not Metal: CoreAnimation
# still draws with its software renderer unless the accelerator names a Metal plug-in, which is
# what configs/polaris-metal-boot.conf adds.
BOOT_ARGS="debug=0x8 rd=md0 root_apfs=ufs_darwin ufs=2 ufs_native=1 cryptex_os_block=2621440 cryptex_app_block=3670016 darwin_data=3932160 var_hfs=ufs_darwin_data data_required=1 battery=1 touchscreen=1 bootcpu=7 cpus=8 cpufreq=1 screen_log=0 gpu=1 ufs_write=1"

OUTPUT_IMAGE=out/boot/polaris.img
MAX_IMAGE_BYTES=67108864
