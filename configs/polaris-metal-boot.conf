# Polaris boot image with CoreAnimation on Metal (built 2026-11-13).
#
# This is configs/polaris-boot.conf with two arguments added, and nothing else: the accelerator
# names HakiosMetal as its Metal plug-in (metal=3, read in MiniIOMobileFramebuffer.cpp), and it is
# handed the metallib that CoreAnimation's renderer needs (ca_metallib=). That file is not part of
# Darwin's QuartzCore here; tools/ca-metallib.py builds it from the framework on the build machine
# and the loader ships it in the ramdisk at /polaris/share/ca-metallib.
#
# Build it with the plug-in and that directory:
#
#   python3 tools/ca-metallib.py userland/share/ca-metallib
#   EXTRA_SHARE=$PWD/userland/share/ca-metallib METAL_PLUGIN=ca \
#       tools/build-boot.sh configs/polaris-metal-boot.conf
#
# State on the phone: the GPU comes up (power, firmware, HFI, ZAP, CP), the service is created,
# the plug-in opens it and answers CoreAnimation, command buffers reach the GPU and two frames
# are swapped onto the panel -- and the panel stays black. The window server stops after those
# frames; the cause is not yet known. Until it is, configs/polaris-boot.conf is the working image
# and this one is the experiment.
# shellcheck source=/dev/null
source "$(dirname "${BASH_SOURCE[0]}")/polaris-boot.conf"

BOOT_ARGS="$BOOT_ARGS metal=3 ca_metallib=/polaris/share/ca-metallib/QuartzCore-default.metallib"
OUTPUT_IMAGE=out/boot/polaris-metal.img
